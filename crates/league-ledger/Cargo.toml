[package]
name = "league-ledger"
description = "Merchant League ledger access: XRPL Testnet only, refused everywhere else"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
league-error = { path = "../league-error" }
xrpl = { package = "xrpl-rust", version = "=1.3.0", default-features = false, features = ["std", "core", "utils", "models", "wallet"] }
# The versions xrpl-rust already uses, so the build carries one copy of each.
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.10.9"
strum = "0.26.3"
ureq = { version = "3.5", features = ["json"] }

[dev-dependencies]
getrandom = "0.3.4"

[lints]
workspace = true
