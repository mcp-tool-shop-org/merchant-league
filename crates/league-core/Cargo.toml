[package]
name = "league-core"
description = "Merchant League v2 pure-state simultaneous turn engine, contract semantics, scoring, and deterministic replay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Host- and harness-only raw engine inspection and full-Sweep preview entry points for
# `league-core` integration tests and `league-standalone` conformance checks.
# Forbidden in seat-facing crates (`league-tui`, `league-relay`, etc.).
engine-internals = []

[dependencies]
league-error = { path = "../league-error" }
getrandom = "0.3.4"
hex = "0.4.3"
hkdf = "0.12.4"
rand_chacha = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
vrf-r255 = "0.1.0"

[dev-dependencies]
league-core = { path = ".", features = ["engine-internals"] }
proptest = "1.12.0"

[lints]
workspace = true
