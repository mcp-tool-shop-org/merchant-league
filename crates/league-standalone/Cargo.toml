[package]
name = "league-standalone"
description = "Stand-alone xrpld container harness and Seed-27 ledger conformance suite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
league-core = { path = "../league-core", features = ["engine-internals"] }
league-error = { path = "../league-error" }
league-ledger = { path = "../league-ledger" }
xrpl = { package = "xrpl-rust", version = "=1.3.0", default-features = false, features = ["std", "core", "utils", "models", "wallet"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
strum = "0.26.3"
ureq = { version = "3.5", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
