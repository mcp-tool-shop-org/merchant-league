[package]
name = "league-eval"
description = "Merchant League Evaluation Mode turn driver, frozen-state branch runner, and state selector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "league_eval"
path = "src/lib.rs"

[[bin]]
name = "league-eval"
path = "src/main.rs"

[dependencies]
league-core = { path = "../league-core" }
league-error = { path = "../league-error" }
league-relay = { path = "../league-relay" }
league-scorer = { path = "../league-scorer" }
getrandom = "0.3.4"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"

[lints]
workspace = true
