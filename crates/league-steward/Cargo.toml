[package]
name = "league-steward"
description = "Phase 1 Game Mode Steward settlement, BatchV1_1 clearing, DelegateSet regents, and MemoData firewall on stand-alone xrpld"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hex = "0.4.3"
league-core = { path = "../league-core" }
league-error = { path = "../league-error" }
league-ledger = { path = "../league-ledger" }
league-season = { path = "../league-season" }
league-standalone = { path = "../league-standalone" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
strum = "0.26.3"
xrpl = { package = "xrpl-rust", version = "=1.3.0", default-features = false, features = ["std", "core", "utils", "models", "wallet"] }

[lints]
workspace = true
