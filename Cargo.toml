[workspace]
resolver = "3"
members = [
    "crates/league-core",
    "crates/league-dice",
    "crates/league-ledger",
    "crates/league-season",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/mcp-tool-shop-org/merchant-league"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
