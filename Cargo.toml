[workspace]
resolver = "3"
members = [
    "crates/league-core",
    "crates/league-dice",
    "crates/league-ledger",
    "crates/league-season",
    "crates/league-tui",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/mcp-tool-shop-org/merchant-league"
publish = false

[workspace.dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
sha2 = "0.11.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
