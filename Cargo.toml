[workspace]
resolver = "3"
# Third-party code, patched and vendored; not a workspace member (our lints do not apply).
exclude = ["vendor"]
members = [
    "crates/league-core",
    "crates/league-error",
    "crates/league-eval",
    "crates/league-gen",
    "crates/league-ledger",
    "crates/league-relay",
    "crates/league-scorer",
    "crates/league-season",
    "crates/league-seat-types",
    "crates/league-seat-ui",
    "crates/league-standalone",
    "crates/league-tui",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/mcp-tool-shop-org/merchant-league"
publish = false

[workspace.dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

# xrpl-rust 1.3.0 as published, plus upstream's own fix for RUSTSEC-2026-0387
# (XRPLF/xrpl-rust 2a5191b, 2026-10-26), which no release carries yet. See
# vendor/xrpl-rust/VENDORED.md.
[patch.crates-io]
xrpl-rust = { path = "vendor/xrpl-rust" }
