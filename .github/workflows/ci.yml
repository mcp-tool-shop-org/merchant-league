name: CI

# push is paths-gated (CI minutes are finite). pull_request carries no paths
# filter, because this workflow emits the required check: a docs-only PR must
# still report it (org rule, amended 2026-09-30).
on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "rust-toolchain.toml"
      - "crates/**"
      - "vendor/**"
      - "scripts/**"
      # The npm audit gate's allowlist: '.github/workflows/**' does not cover it, and
      # a change to it changes what the Site build step passes.
      - ".github/audit-allowlist.json"
      - "atlas/**"
      - "README.md"
      - "SECURITY.md"
      - "docs/**"
      - "site/**"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The runner's rustup reads rust-toolchain.toml and installs the pinned
      # toolchain with its components; no third-party action needed.
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Read runner image id
        id: image
        run: echo "id=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      # Registry, git sources and cargo-llvm-cov. Not target/: a cache
      # of build output across toolchain changes has hung CI elsewhere.
      - name: Cache Cargo downloads and tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-llvm-cov
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.id }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-llvmcov0.9.1
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.id }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --workspace --locked -- -D warnings

      - name: No-std target gate (seat crates and league-error)
        run: |
          rustup target add thumbv7em-none-eabi
          cargo build -p league-error -p league-seat-types -p league-seat-ui --target thumbv7em-none-eabi --locked

      # B4 / Card 7 note: league-tui is the binary host crate depending on league-core (owning
      # ClubHost and building per-seat SeatObservation values passed to league-seat-ui);
      # league-gen and league-relay also carry a league-core dependency (league-relay strictly for
      # the stateless public what-if preview helper `preview_seat_bundle`). This standalone check
      # ensures none of these crates enables `league-core/engine-internals`; ledger and seat crates
      # (league-ledger, league-seat-types, league-seat-ui) cannot depend on league-core at all
      # (enforced in the next step).
      - name: Standalone host/gen/relay feature check
        run: |
          cargo build -p league-tui --locked
          cargo build -p league-eval --locked
          if cargo tree -p league-tui -e features --locked | grep -q 'engine-internals'; then
            echo "ERROR: league-tui enabled league-core/engine-internals in standalone build"
            exit 1
          fi
          if cargo tree -p league-gen -e features --locked | grep -q 'engine-internals'; then
            echo "ERROR: league-gen enabled league-core/engine-internals in standalone build"
            exit 1
          fi
          if cargo tree -p league-relay -e features --locked | grep -q 'engine-internals'; then
            echo "ERROR: league-relay enabled league-core/engine-internals in standalone build"
            exit 1
          fi
          if cargo tree -p league-relay -e normal,build,dev --target all --all-features --locked | grep -q 'engine-internals'; then
            echo "ERROR: league-relay optionally enabled league-core/engine-internals"
            exit 1
          fi
          if cargo tree -p league-eval -e features --locked | grep -q 'engine-internals'; then
            echo "ERROR: league-eval default dependency tree enabled league-core/engine-internals"
            exit 1
          fi
          if cargo tree -p league-eval -e normal,build,dev --target all --all-features --locked | grep -q 'engine-internals'; then
            echo "ERROR: league-eval optionally enabled league-core/engine-internals"
            exit 1
          fi

      - name: No league-core dependency in ledger or seat crates
        run: |
          cargo tree -p league-ledger -p league-seat-types -p league-seat-ui -e normal,build,dev --target all --locked
          if cargo tree -p league-ledger -p league-seat-types -p league-seat-ui -e normal,build,dev --target all --locked | grep -q 'league-core'; then
            echo "ERROR: ledger or a seat crate depends on league-core"
            exit 1
          fi
          if cargo tree -p league-ledger -p league-seat-types -p league-seat-ui -e normal,build,dev --target all --all-features --locked | grep -q 'league-core'; then
            echo "ERROR: ledger or a seat crate optionally depends on league-core"
            exit 1
          fi
          if cargo tree -p league-seat-types -p league-seat-ui -e normal,build,dev --target all --all-features --locked | grep -Eq 'league-core|league-gen|league-standalone'; then
            echo "ERROR: seat crate depends on league-core, league-gen, or league-standalone"
            exit 1
          fi
          if cargo tree -p league-seat-ui -e normal,build,dev --target all --all-features --locked | grep -Eq 'ratatui|crossterm'; then
            echo "ERROR: league-seat-ui depends on ratatui or crossterm"
            exit 1
          fi

      - name: Test
        run: cargo test --workspace --locked

      # Coverage floor 92, raised for Card 5 Part B2b (CI measured 92.16% lines). Never
      # lowered to make a build green.
      - name: Coverage
        run: |
          command -v cargo-llvm-cov >/dev/null || cargo install cargo-llvm-cov --locked --version "0.9.1"
          cargo llvm-cov --workspace --locked --fail-under-lines 92

      - name: Testnet only
        run: bash scripts/check-testnet-only.sh

      - name: No real-money language
        run: bash scripts/check-copy.sh

      # Every guard pattern, planted: each bad case must fail, each good one pass.
      - name: Guard controls
        run: bash scripts/test-guards.sh

      - name: Set up Node for Atlas
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.26.0 check

      # The landing page and handbook build here, so a broken page fails the PR
      # rather than the Pages deploy after merge (pages.yml runs only on main).
      # The site's npm audit goes through scripts/check-audit-allowlist.mjs
      # (ported from brand, tested by the node --test line): reviewed,
      # time-boxed exceptions live in .github/audit-allowlist.json, and any
      # high/critical advisory not listed there, listed but expired, or whose
      # reported range or fix status has changed, still fails this step.
      - name: Site build
        working-directory: site
        run: |
          npm ci --no-fund --no-audit
          node --test ../scripts/check-audit-allowlist.test.mjs
          set +e
          npm audit --audit-level=high --json > audit-report.json
          AUDIT_EXIT=$?
          set -e
          node ../scripts/check-audit-allowlist.mjs audit-report.json ../.github/audit-allowlist.json "$AUDIT_EXIT" package-lock.json
          npm run build

      - name: Stand-alone xrpld harness
        env:
          LEAGUE_XRPLD_LIVE: full
          DOCKER_BUILDKIT: "0"
        run: |
          timeout 300 cargo test -p league-standalone --test standalone_live --locked -- --nocapture --test-threads=1
          test -z "$(docker ps -aq --filter label=merchant-league.harness=standalone)"

      - name: Club Mode container smoke gate (offline, no push)
        timeout-minutes: 15
        run: bash scripts/smoke-container.sh

  # The advisory audit runs in its own job. A new advisory is an event in the
  # outside database, not in this change: in its own job it turns only this
  # check red, and the build, tests, guards and harness above still run and
  # report. Advisories are fixed by upgrading or replacing, never ignored.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Read runner image id
        id: image
        run: echo "id=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Cache cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.id }}-0.22.2

      # `cargo audit --version` prints `cargo-audit-audit <version>`.
      - name: Security audit
        run: |
          if [ "$(cargo audit --version 2>/dev/null || true)" != "cargo-audit-audit 0.22.2" ]; then
            cargo install cargo-audit --locked --force --version "0.22.2"
          fi
          cargo audit --version
          cargo audit --deny warnings
