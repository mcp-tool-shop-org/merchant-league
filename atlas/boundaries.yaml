summary: "Merchant League: a slow-turn trading game for 2 to 6 players, played only on the XRPL Testnet."
boundaries:
  - name: .github
    globs:
      - .github/**
    role: config
  - name: docs
    globs:
      - docs/**
    role: docs
  - name: league-core
    globs:
      - crates/league-core/**
    role: code
  - name: league-error
    globs:
      - crates/league-error/**
    role: code
  - name: league-eval
    globs:
      - crates/league-eval/**
    role: code
  - name: league-gen
    globs:
      - crates/league-gen/**
    role: code
  - name: league-ledger
    globs:
      - crates/league-ledger/**
    role: code
  - name: league-relay
    globs:
      - crates/league-relay/**
    role: code
  - name: league-scorer
    globs:
      - crates/league-scorer/**
    role: code
  - name: league-season
    globs:
      - crates/league-season/**
    role: code
  - name: league-seat-types
    globs:
      - crates/league-seat-types/**
    role: code
  - name: league-seat-ui
    globs:
      - crates/league-seat-ui/**
    role: code
  - name: league-standalone
    globs:
      - crates/league-standalone/**
    role: code
  - name: league-tui
    globs:
      - crates/league-tui/**
    role: code
  - name: root
    globs:
      - "*"
    role: config
  - name: scripts
    globs:
      - scripts/**
    role: code
