    "LimpidCrypto <contact@limpidcrypto.com>",
]
build = false
include = [
    "src/**/*",
    "Cargo.toml",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A 100% Rust library to interact with the XRPL"
readme = "README.md"
keywords = [
    "xrpl",
    "no_std",
]
categories = ["no-std"]
license = "ISC"
repository = "https://github.com/sephynox/xrpl-rust"

[package.metadata.release]
